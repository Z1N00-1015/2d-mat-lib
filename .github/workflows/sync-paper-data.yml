name: Sync research paper database

on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check private repository token
        env:
          SOURCE_TOKEN: ${{ secrets.LAB_PAPER_LIBRARY_READ_TOKEN }}
        run: |
          if [ -z "$SOURCE_TOKEN" ]; then
            echo "::error::Add the LAB_PAPER_LIBRARY_READ_TOKEN Actions secret with read access to Z1N00-1015/lab-paper-library."
            exit 1
          fi

      - name: Check out private paper library
        uses: actions/checkout@v4
        with:
          repository: Z1N00-1015/lab-paper-library
          token: ${{ secrets.LAB_PAPER_LIBRARY_READ_TOKEN }}
          path: lab-paper-library
          persist-credentials: false

      - name: Export reviewed public data
        working-directory: lab-paper-library
        run: python3 public_export.py --out "$GITHUB_WORKSPACE/data/papers.json"

      - name: Validate exported JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("data/papers.json").read_text(encoding="utf-8"))
          if not isinstance(data.get("papers"), list):
              raise SystemExit("data/papers.json must contain a papers array")
          if not isinstance(data.get("metrics"), dict):
              raise SystemExit("data/papers.json must contain a metrics object")
          if not isinstance(data.get("generated_at"), str):
              raise SystemExit("data/papers.json must contain generated_at")
          print(f"Validated {len(data['papers'])} exported papers")
          PY

      - name: Detect data changes
        id: changes
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          path = Path("data/papers.json")
          current = json.loads(path.read_text(encoding="utf-8"))
          previous_bytes = subprocess.run(
              ["git", "show", "HEAD:data/papers.json"],
              check=True,
              capture_output=True,
          ).stdout
          previous = json.loads(previous_bytes)
          stable = lambda data: {key: value for key, value in data.items() if key != "generated_at"}
          if stable(current) == stable(previous):
              path.write_bytes(previous_bytes)
              print("No paper data changes; ignoring the export timestamp.")
          PY
          git add data/papers.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated database export
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): sync reviewed research papers"
          git push origin HEAD:main

      - name: Configure GitHub Pages
        if: steps.changes.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Prepare site files
        if: steps.changes.outputs.changed == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --exclude='.git' --exclude='.github' --exclude='lab-paper-library/' ./ "$RUNNER_TEMP/site/"
          touch "$RUNNER_TEMP/site/.nojekyll"

      - name: Upload updated site artifact
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: sync-and-deploy
    if: needs.sync-and-deploy.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy updated site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
