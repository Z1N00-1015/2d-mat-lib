<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>논문 데이터 · 도구 · Beyond Silicon</title>
<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../../assets/css/book.css?v=20261022-paper-search">
<script type="importmap">{ "imports": { "three": "../../assets/vendor/three.module.min.js", "three/addons/OrbitControls.js": "../../assets/vendor/OrbitControls.js" } }</script>
<script type="module" src="../../assets/js/book-runtime.js?v=20261022-paper-search"></script>
</head>
<body data-root="../../" data-field="tools" data-chapter="papers">
<main class="main">
<article class="article">
  <header class="chapter-head">
    <div class="eyebrow">TOOLS · RESEARCH DATA</div>
    <h1>논문 데이터</h1>
    <p class="lede">연구실 라이브러리에 저장된 논문을 제목·저자·소재와 검토 데이터로 찾아봅니다.</p>
    <div class="meta"></div>
  </header>

  <div id="paper-library-search" data-module="papersearch">
    <h2><span class="sec">1.1</span>논문 검색</h2>
    <p>검색어를 입력하면 저장된 논문 가운데 일치하는 항목을 찾아줍니다. 제목, 저자, 저널, 연도, DOI, 소재와 공개된 검토 데이터에서 검색합니다.</p>
    <p class="hint">검색 대상은 공개용 논문 데이터입니다. 논문 PDF 전문은 이 사이트에 공개되거나 검색되지 않습니다.</p>
    <div class="paper-search-box">
      <label for="paper-library-query">논문 라이브러리 검색</label>
      <div class="paper-search-row">
        <input id="paper-library-query" data-paper-search type="search" autocomplete="off" placeholder="예: MoS₂, hypotaxy, Jinwoo Kim, DOI">
        <button class="paper-search-clear" data-paper-clear type="button" hidden>지우기</button>
      </div>
      <p class="paper-search-status" data-paper-status aria-live="polite"></p>
    </div>
    <p class="paper-search-updated" data-paper-updated></p>
    <div class="paper-search-list" data-paper-results aria-live="polite"></div>
  </div>
</article>
</main>
</body>
</html>
