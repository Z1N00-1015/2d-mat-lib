<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>논문 데이터 · 도구 · Beyond Silicon</title>
<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../../assets/css/book.css?v=20261022-hierarchy">
<script type="importmap">{ "imports": { "three": "../../assets/vendor/three.module.min.js", "three/addons/OrbitControls.js": "../../assets/vendor/OrbitControls.js" } }</script>
<script type="module" src="../../assets/js/book-runtime.js?v=20261023-remove-wbg-power"></script>
</head>
<body data-root="../../" data-field="tools" data-chapter="papers">
<main class="main">
<article class="article">
  <header class="chapter-head">
    <div class="eyebrow">TOOLS · PAPER LIBRARY</div>
    <h1>논문 데이터</h1>
    <p class="lede">대표 키워드를 고르거나 검색어를 입력해 연구실 라이브러리의 논문을 찾아보세요.</p>
    <div class="meta"></div>
  </header>

  <div id="paper-library-search" data-module="papersearch">
    <h2><span class="sec">1.1</span>논문 검색</h2>
    <p>제목, 저자, 저널, 연도, DOI, 소재와 공개된 검토 데이터를 검색합니다.</p>
    <div class="paper-search-box">
      <label for="paper-library-query">논문 라이브러리 검색</label>
      <div class="paper-search-row">
        <input id="paper-library-query" data-paper-search type="search" autocomplete="off" placeholder="예: MoS₂, hypotaxy, Jinwoo Kim, DOI">
        <button class="paper-search-clear" data-paper-clear type="button" hidden>지우기</button>
      </div>
      <p class="paper-search-status" data-paper-status aria-live="polite"></p>
      <div class="paper-keywords" aria-label="대표 키워드">
        <span class="paper-keywords-label">대표 키워드</span>
        <button type="button" data-paper-keyword="MoS2">MoS₂</button>
        <button type="button" data-paper-keyword="WSe2">WSe₂</button>
        <button type="button" data-paper-keyword="InSe">InSe</button>
        <button type="button" data-paper-keyword="SnS">SnS · SnS₂</button>
        <button type="button" data-paper-keyword="hypotaxy">Hypotaxy</button>
        <button type="button" data-paper-keyword="epitaxy">Epitaxy</button>
        <button type="button" data-paper-keyword="moiré">Moiré</button>
        <button type="button" data-paper-keyword="ferroelectricity">강유전성</button>
        <button type="button" data-paper-keyword="FET">FET</button>
      </div>
    </div>
    <div class="paper-search-list" data-paper-results aria-live="polite" hidden></div>
  </div>
</article>
</main>
</body>
</html>
